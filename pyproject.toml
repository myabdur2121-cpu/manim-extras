[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-extras"
version = "0.1.0"
description = "A collection of reusable Manim components."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "manim>=0.18",
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/manim_extras"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["F403", "F405"]
